<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Clock ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring1)" stroke-width="24" stroke-linecap="round" stroke-dasharray="754 1006" transform="rotate(-90 256 256)"/>
  <!-- Clock face -->
  <circle cx="256" cy="256" r="130" fill="rgba(255,255,255,0.05)"/>
  <!-- Hour marks -->
  <line x1="256" y1="140" x2="256" y2="160" stroke="#a0a0b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="372" y1="256" x2="352" y2="256" stroke="#a0a0b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="372" x2="256" y2="352" stroke="#a0a0b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="256" x2="160" y2="256" stroke="#a0a0b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="180" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="320" y2="220" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
  <circle cx="256" cy="256" r="6" fill="#1a1a2e"/>
  <!-- Check mark badge -->
  <circle cx="370" cy="370" r="56" fill="#22c55e"/>
  <path d="M345 370 L365 390 L395 350" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
